name: Actualizar IPTV LATAM

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl ffmpeg

      - name: Descargar datos de iptv-org
        run: |
          curl -L --fail --retry 3 \
            https://iptv-org.github.io/api/channels.json \
            -o channels.json

          curl -L --fail --retry 3 \
            https://iptv-org.github.io/api/streams.json \
            -o streams.json

      - name: Generar lista LATAM
        run: |
          python3 <<'PY'
          import json
          import os
          import re

          LATAM = {
              "ar",  # Argentina
              "bo",  # Bolivia
              "br",  # Brasil
              "cl",  # Chile
              "co",  # Colombia
              "cr",  # Costa Rica
              "cu",  # Cuba
              "do",  # República Dominicana
              "ec",  # Ecuador
              "sv",  # El Salvador
              "gt",  # Guatemala
              "hn",  # Honduras
              "mx",  # México
              "ni",  # Nicaragua
              "pa",  # Panamá
              "py",  # Paraguay
              "pe",  # Perú
              "pr",  # Puerto Rico
              "uy",  # Uruguay
              "ve",  # Venezuela
          }

          with open("channels.json", "r", encoding="utf-8") as f:
              channels = json.load(f)

          with open("streams.json", "r", encoding="utf-8") as f:
              streams = json.load(f)

          # Canales cuyo país pertenece a LATAM
          latam_channels = {}

          for channel in channels:
              channel_id = channel.get("id")

              if not channel_id:
                  continue

              countries = channel.get("country", [])

              if isinstance(countries, str):
                  countries = [countries]

              countries = {
                  str(country).lower()
                  for country in countries
              }

              # También aceptar broadcast_area LATAM
              broadcast = channel.get("broadcastArea", [])

              if isinstance(broadcast, str):
                  broadcast = [broadcast]

              broadcast = {
                  str(area).lower()
                  for area in broadcast
              }

              es_latam = bool(countries & LATAM)

              if not es_latam:
                  for area in broadcast:
                      if "latin" in area or "latam" in area:
                          es_latam = True
                          break

              if es_latam:
                  latam_channels[channel_id] = channel

          print(f"Canales LATAM encontrados: {len(latam_channels)}")

          # Agrupar streams por canal
          streams_por_canal = {}

          for stream in streams:
              channel_id = stream.get("channel")

              if not channel_id:
                  continue

              if channel_id not in latam_channels:
                  continue

              url = stream.get("url")

              if not url:
                  continue

              if not url.startswith(("http://", "https://")):
                  continue

              streams_por_canal.setdefault(
                  channel_id,
                  []
              ).append(stream)

          os.makedirs("listas", exist_ok=True)

          salida = "listas/latam.m3u"

          vistos = set()
          total = 0

          with open(salida, "w", encoding="utf-8") as out:

              out.write("#EXTM3U\n")

              for channel_id, channel in sorted(
                  latam_channels.items(),
                  key=lambda x: x[1].get("name", "").lower()
              ):

                  nombre = channel.get("name", channel_id)

                  logo = channel.get("logo", "")

                  paises = channel.get("country", [])

                  if isinstance(paises, str):
                      paises = [paises]

                  pais = paises[0].upper() if paises else "LATAM"

                  for stream in streams_por_canal.get(
                      channel_id,
                      []
                  ):

                      url = stream.get("url")

                      if url in vistos:
                          continue

                      vistos.add(url)

                      # Metadatos adicionales
                      headers = stream.get("http", {})

                      line = (
                          f'#EXTINF:-1 '
                          f'tvg-id="{channel_id}" '
                          f'tvg-name="{nombre}" '
                          f'tvg-logo="{logo}" '
                          f'group-title="🇱🇦 LATAM - {pais}",'
                          f'{nombre}\n'
                      )

                      out.write(line)
                      out.write(url + "\n")

                      total += 1

          print(f"Streams encontrados: {total}")
          print(f"Lista creada: {salida}")
          PY

      - name: Comprobar streams
        run: |
          python3 <<'PY'
          import subprocess
          import os

          entrada = "listas/latam.m3u"
          salida = "listas/latam_activos.m3u"

          with open(
              entrada,
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as f:
              lineas = f.readlines()

          resultado = ["#EXTM3U\n"]

          total = 0
          activos = 0

          i = 0

          while i < len(lineas):

              if not lineas[i].startswith("#EXTINF"):
                  i += 1
                  continue

              info = lineas[i].rstrip()

              if i + 1 >= len(lineas):
                  break

              url = lineas[i + 1].strip()

              total += 1

              print(f"[{total}] Comprobando:")
              print(url)

              try:

                  proceso = subprocess.run(
                      [
                          "ffprobe",
                          "-v",
                          "error",
                          "-rw_timeout",
                          "8000000",
                          "-user_agent",
                          "Mozilla/5.0",
                          "-i",
                          url,
                          "-show_entries",
                          "stream=codec_type",
                          "-of",
                          "csv=p=0"
                      ],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      timeout=15
                  )

                  if proceso.returncode == 0:

                      resultado.append(info + "\n")
                      resultado.append(url + "\n")

                      activos += 1

                      print("  ✓ ACTIVO")

                  else:

                      print("  ✗ NO DISPONIBLE")

              except Exception as e:

                  print("  ✗ ERROR")

              i += 2

          with open(
              salida,
              "w",
              encoding="utf-8"
          ) as f:

              f.writelines(resultado)

          os.replace(
              salida,
              entrada
          )

          print()
          print("================================")
          print(f"Streams encontrados : {total}")
          print(f"Streams activos     : {activos}")
          print(f"Streams eliminados  : {total - activos}")
          print("================================")
          PY

      - name: Eliminar duplicados
        run: |
          python3 <<'PY'
          entrada = "listas/latam.m3u"
          salida = "listas/latam_final.m3u"

          with open(
              entrada,
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as f:
              lineas = f.readlines()

          resultado = ["#EXTM3U\n"]
          urls = set()

          i = 1

          while i < len(lineas):

              if not lineas[i].startswith("#EXTINF"):
                  i += 1
                  continue

              if i + 1 >= len(lineas):
                  break

              info = lineas[i]
              url = lineas[i + 1].strip()

              if url not in urls:

                  urls.add(url)

                  resultado.append(info)
                  resultado.append(url + "\n")

              i += 2

          with open(
              salida,
              "w",
              encoding="utf-8"
          ) as f:

              f.writelines(resultado)

          import os

          os.replace(
              salida,
              entrada
          )

          print(
              f"Lista final: {len(urls)} streams"
          )
          PY

      - name: Mostrar estadísticas
        run: |
          echo "======================================"
          echo "       IPTV LATAM ACTUALIZADO"
          echo "======================================"
          echo "Archivo: listas/latam.m3u"
          echo "Canales activos:"
          grep -c "^#EXTINF" listas/latam.m3u || true
          echo "======================================"

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add listas/latam.m3u

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar IPTV LATAM"
            git push
          fi
