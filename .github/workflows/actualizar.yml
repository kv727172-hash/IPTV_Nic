
name: Actualizar IPTV Nicaragua Centroamerica LATAM

on:
  workflow_dispatch:
  schedule:
    - cron: "20 12 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-iptv
  cancel-in-progress: false

jobs:
  actualizar:
    name: Buscar y verificar canales
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar lista IPTV verificada
        shell: bash
        run: |
          cat > actualizar_iptv_temp.py <<'PYTHON'
          import re
          import math
          import time
          import ipaddress
          import urllib.request
          import urllib.parse
          from pathlib import Path
          from collections import defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed

          # =====================================
          # CONFIGURACION PRINCIPAL
          # =====================================

          SALIDA = Path(
              "latam_centroamerica_internacionales.m3u"
          )

          ORIGEN_CORS = "http://localhost:3000"
          MAX_TRABAJADORES = 16
          TIMEOUT = 9
          MAX_OPCIONES = 4
          MIN_RETENCION = 0.25

          BASE = "https://iptv-org.github.io/iptv"

          # =====================================
          # PAISES PRIORITARIOS
          # =====================================

          CENTROAMERICA = {
              "NI": "🇳🇮 Nicaragua",
              "HN": "🇭🇳 Honduras",
              "SV": "🇸🇻 El Salvador",
              "GT": "🇬🇹 Guatemala",
              "CR": "🇨🇷 Costa Rica",
              "PA": "🇵🇦 Panamá",
              "BZ": "🇧🇿 Belice",
          }

          LATAM = {
              "MX": "🇲🇽 México",
              "AR": "🇦🇷 Argentina",
              "BO": "🇧🇴 Bolivia",
              "CL": "🇨🇱 Chile",
              "CO": "🇨🇴 Colombia",
              "EC": "🇪🇨 Ecuador",
              "PE": "🇵🇪 Perú",
              "PY": "🇵🇾 Paraguay",
              "UY": "🇺🇾 Uruguay",
              "VE": "🇻🇪 Venezuela",
              "CU": "🇨🇺 Cuba",
              "DO": "🇩🇴 República Dominicana",
              "PR": "🇵🇷 Puerto Rico",
              "HT": "🇭🇹 Haití",
              "GY": "🇬🇾 Guyana",
              "SR": "🇸🇷 Surinam",
              "AW": "🇦🇼 Aruba",
              "CW": "🇨🇼 Curazao",
              "BQ": "🇧🇶 Caribe Neerlandés",
              "SX": "🇸🇽 Sint Maarten",
              "MF": "🇲🇫 San Martín",
              "MQ": "🇲🇶 Martinica",
              "GP": "🇬🇵 Guadalupe",
              "GF": "🇬🇫 Guayana Francesa",
              "BL": "🇧🇱 San Bartolomé",
              "JM": "🇯🇲 Jamaica",
              "TT": "🇹🇹 Trinidad y Tobago",
              "BS": "🇧🇸 Bahamas",
              "BB": "🇧🇧 Barbados",
              "AG": "🇦🇬 Antigua y Barbuda",
              "DM": "🇩🇲 Dominica",
              "GD": "🇬🇩 Granada",
              "KN": "🇰🇳 San Cristóbal y Nieves",
              "LC": "🇱🇨 Santa Lucía",
              "VC": "🇻🇨 San Vicente",
              "KY": "🇰🇾 Islas Caimán",
              "TC": "🇹🇨 Islas Turcas y Caicos",
              "VG": "🇻🇬 Islas Vírgenes Británicas",
              "VI": "🇻🇮 Islas Vírgenes EE.UU.",
              "AI": "🇦🇮 Anguila",
              "MS": "🇲🇸 Montserrat",
          }

          PAISES = {
              **CENTROAMERICA,
              **LATAM,
          }

          ORDEN = {
              codigo: posicion
              for posicion, codigo in enumerate(PAISES)
          }

          INTERNACIONALES = "🌐 Internacionales"

          # =====================================
          # FUENTES IPTV
          # =====================================

          FUENTES = [
              (f"{BASE}/index.m3u", None),
              (f"{BASE}/index.country.m3u", None),
              (f"{BASE}/regions/cenamer.m3u", None),
              (f"{BASE}/regions/latam.m3u", None),
              (f"{BASE}/regions/hispam.m3u", None),
              (f"{BASE}/regions/carib.m3u", None),
          ]

          # Fuentes por pais
          for codigo in PAISES:
              FUENTES.append(
                  (
                      f"{BASE}/countries/{codigo.lower()}.m3u",
                      codigo
                  )
              )

          # =====================================
          # SEGURIDAD DE DIRECCIONES
          # =====================================

          def url_segura(direccion):
              try:
                  u = urllib.parse.urlsplit(direccion)

                  if u.scheme not in ("https", "http"):
                      return False

                  if not u.hostname or u.username or u.password:
                      return False

                  nombre = u.hostname.lower()

                  if (
                      nombre == "localhost"
                      or nombre.endswith(".local")
                      or nombre.endswith(".internal")
                  ):
                      return False

                  try:
                      ip = ipaddress.ip_address(nombre)
                      return ip.is_global
                  except ValueError:
                      return True

              except Exception:
                  return False

          class RedireccionSegura(
              urllib.request.HTTPRedirectHandler
          ):
              def redirect_request(
                  self, req, fp, code, msg,
                  headers, newurl
              ):
                  if not url_segura(newurl):
                      raise ValueError(
                          "Redireccion no permitida"
                      )

                  return super().redirect_request(
                      req, fp, code, msg,
                      headers, newurl
                  )

          ABRIDOR = urllib.request.build_opener(
              RedireccionSegura()
          )

          def descargar(
              url,
              limite=500000,
              cors=False,
              segmento=False,
              timeout=TIMEOUT
          ):
              if not url_segura(url):
                  raise ValueError("URL no segura")

              cabeceras = {
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "*/*",
              }

              if cors:
                  cabeceras["Origin"] = ORIGEN_CORS

              if segmento:
                  cabeceras["Range"] = "bytes=0-2047"

              peticion = urllib.request.Request(
                  url,
                  headers=cabeceras
              )

              with ABRIDOR.open(
                  peticion,
                  timeout=timeout
              ) as respuesta:

                  destino = respuesta.geturl()

                  if not url_segura(destino):
                      raise ValueError(
                          "Destino no permitido"
                      )

                  if cors:
                      permitido = respuesta.headers.get(
                          "Access-Control-Allow-Origin",
                          ""
                      )

                      if permitido not in (
                          "*",
                          ORIGEN_CORS
                      ):
                          raise ValueError(
                              "CORS no disponible"
                          )

                  contenido = respuesta.read(
                      limite + 1
                  )

                  if not contenido:
                      raise ValueError(
                          "Respuesta vacia"
                      )

                  if len(contenido) > limite:
                      raise ValueError(
                          "Archivo demasiado grande"
                      )

                  if contenido.lstrip().lower().startswith(
                      (b"<html", b"<!doctype")
                  ):
                      raise ValueError(
                          "Se recibio HTML"
                      )

                  return contenido, destino

          # =====================================
          # LECTURA DE LISTAS M3U
          # =====================================

          ATRIBUTO = re.compile(
              r'([\w-]+)="([^"]*)"'
          )

          def leer_lista(datos):
              texto = datos.decode(
                  "utf-8-sig",
                  errors="replace"
              )

              if not texto.lstrip().startswith("#EXTM3U"):
                  raise ValueError(
                      "La fuente no es una lista M3U"
                  )

              meta = None

              for original in texto.splitlines():
                  linea = original.strip()

                  if linea.startswith("#EXTINF:"):
                      partes = linea.split(",", 1)

                      if len(partes) != 2:
                          meta = None
                          continue

                      meta = {
                          "nombre": partes[1].strip(),
                          "atributos": dict(
                              ATRIBUTO.findall(partes[0])
                          ),
                      }

                  elif (
                      meta
                      and linea
                      and not linea.startswith("#")
                  ):
                      if url_segura(linea):
                          yield {
                              **meta,
                              "url": linea,
                          }

                      meta = None

          # =====================================
          # CLASIFICAR PAISES
          # =====================================

          def pais_canal(canal, pais_fuente=None):
              a = canal["atributos"]

              identificador = a.get(
                  "tvg-id", ""
              ).split("@")[0]

              coincidencia = re.search(
                  r"\.([a-z]{2})$",
                  identificador,
                  re.I
              )

              codigo = (
                  coincidencia.group(1).upper()
                  if coincidencia
                  else ""
              )

              etiquetas = set(
                  re.split(
                      r"[,; /]+",
                      a.get("tvg-country", "").upper()
                  )
              )

              grupo = a.get(
                  "group-title", ""
              ).lower()

              if (
                  codigo == "BR"
                  or "BR" in etiquetas
                  or "brazil" in grupo
                  or "brasil" in grupo
                  or pais_fuente == "BR"
              ):
                  return None

              if codigo in PAISES:
                  return codigo

              for c, titulo in PAISES.items():
                  limpio = re.sub(
                      r"^[^\w]+", "", titulo
                  ).strip().lower()

                  if c in etiquetas or grupo == limpio:
                      return c

              if pais_fuente in PAISES:
                  return pais_fuente

              if re.search(
                  r"\b(internacional|international|"
                  r"world|global)\b",
                  grupo + " " + canal["nombre"],
                  re.I
              ):
                  return "INT"

              return None

          # =====================================
          # DEDUPLICAR CANALES
          # =====================================

          def clave_canal(canal):
              identificador = canal[
                  "atributos"
              ].get("tvg-id", "")

              if identificador:
                  return identificador.lower()

              nombre = re.sub(
                  r"\s*\((?:\d{3,4}[pi]|"
                  r"hd|sd|fhd|4k)\)",
                  "",
                  canal["nombre"],
                  flags=re.I
              )

              nombre = re.sub(
                  r"[^a-z0-9]",
                  "",
                  nombre.lower()
              )

              return nombre

          def calidad(canal):
              coincidencia = re.search(
                  r"\((\d{3,4})[pi]\)",
                  canal["nombre"],
                  re.I
              )

              resolucion = (
                  int(coincidencia.group(1))
                  if coincidencia
                  else 0
              )

              return (
                  canal["url"].startswith("https://"),
                  resolucion
              )

          # =====================================
          # VERIFICAR HLS
          # =====================================

          def verificar_hls(
              url,
              profundidad=0,
              visitados=None
          ):
              if profundidad > 3:
                  return False

              visitados = set(
                  visitados or []
              )

              if url in visitados:
                  return False

              visitados.add(url)

              try:
                  datos, final = descargar(
                      url,
                      limite=450000,
                      cors=True
                  )

                  texto = datos.decode(
                      "utf-8-sig",
                      errors="replace"
                  )

                  lineas = [
                      x.strip()
                      for x in texto.splitlines()
                      if x.strip()
                  ]

                  if (
                      not lineas
                      or lineas[0] != "#EXTM3U"
                      or not any(
                          "#EXT-X-" in x
                          for x in lineas
                      )
                  ):
                      return False

                  # No importar DRM ni claves
                  # de cifrado externas
                  for linea in lineas:
                      if linea.startswith(
                          "#EXT-X-KEY:"
                      ):
                          if "METHOD=NONE" not in linea:
                              return False

                  variantes = []

                  for i, linea in enumerate(lineas):
                      if linea.startswith(
                          "#EXT-X-STREAM-INF:"
                      ):
                          for siguiente in lineas[i + 1:]:
                              if not siguiente.startswith("#"):
                                  variantes.append(
                                      urllib.parse.urljoin(
                                          final,
                                          siguiente
                                      )
                                  )
                                  break

                  if variantes:
                      return any(
                          verificar_hls(
                              alternativa,
                              profundidad + 1,
                              visitados
                          )
                          for alternativa in variantes[:3]
                      )

                  if not any(
                      linea.startswith("#EXTINF:")
                      for linea in lineas
                  ):
                      return False

                  # Comprobar inicializacion fMP4
                  for linea in lineas:
                      if linea.startswith("#EXT-X-MAP:"):
                          coincidencia = re.search(
                              r'URI="([^"]+)"',
                              linea
                          )

                          if coincidencia:
                              descargar(
                                  urllib.parse.urljoin(
                                      final,
                                      coincidencia.group(1)
                                  ),
                                  limite=2048,
                                  cors=True,
                                  segmento=True
                              )

                  segmentos = [
                      linea
                      for linea in lineas
                      if not linea.startswith("#")
                  ]

                  # Probar ultimos segmentos
                  for segmento in reversed(
                      segmentos[-3:]
                  ):
                      try:
                          descargar(
                              urllib.parse.urljoin(
                                  final,
                                  segmento
                              ),
                              limite=2048,
                              cors=True,
                              segmento=True
                          )
                          return True

                      except Exception:
                          continue

                  return False

              except Exception:
                  return False

          def revisar_grupo(elemento):
              clave, opciones = elemento

              for canal in opciones[:MAX_OPCIONES]:
                  if verificar_hls(canal["url"]):
                      return canal

              return None

          # =====================================
          # PROCESO PRINCIPAL
          # =====================================

          def principal():
              print(
                  "\n📺 ACTUALIZACION IPTV",
                  flush=True
              )

              print(
                  "Nicaragua + Centroamerica + LATAM",
                  flush=True
              )

              grupos = defaultdict(list)
              fuentes_correctas = 0
              total_entradas = 0

              for url, pais_fuente in FUENTES:
                  try:
                      datos, _ = descargar(
                          url,
                          limite=20000000,
                          timeout=35
                      )

                      lista = list(
                          leer_lista(datos)
                      )

                      fuentes_correctas += 1
                      total_entradas += len(lista)

                      for canal in lista:
                          pais = pais_canal(
                              canal,
                              pais_fuente
                          )

                          if not pais:
                              continue

                          canal["pais"] = pais

                          clave = (
                              pais,
                              clave_canal(canal)
                          )

                          grupos[clave].append(canal)

                      print(
                          f"FUENTE OK: {len(lista)} "
                          f"entradas - {url}",
                          flush=True
                      )

                  except Exception as error:
                      print(
                          f"AVISO: {url}: {error}",
                          flush=True
                      )

              if not fuentes_correctas or not grupos:
                  raise RuntimeError(
                      "No se descargaron canales. "
                      "Se conserva la lista anterior."
                  )

              print(
                  f"\nFuentes exitosas: "
                  f"{fuentes_correctas}/{len(FUENTES)}"
              )

              print(
                  f"Entradas encontradas: {total_entradas}"
              )

              trabajos = []

              for clave, opciones in grupos.items():
                  unicas = {}

                  for canal in opciones:
                      unicas.setdefault(
                          canal["url"],
                          canal
                      )

                  ordenadas = sorted(
                      unicas.values(),
                      key=calidad,
                      reverse=True
                  )

                  trabajos.append(
                      (clave, ordenadas)
                  )

              print(
                  f"Canales distintos: {len(trabajos)}",
                  flush=True
              )

              comprobados = 0
              validos = []

              with ThreadPoolExecutor(
                  max_workers=MAX_TRABAJADORES
              ) as executor:

                  futuros = [
                      executor.submit(
                          revisar_grupo,
                          trabajo
                      )
                      for trabajo in trabajos
                  ]

                  for futuro in as_completed(futuros):
                      comprobados += 1

                      resultado = futuro.result()

                      if resultado:
                          validos.append(resultado)

                      if (
                          comprobados % 100 == 0
                          or comprobados == len(futuros)
                      ):
                          print(
                              f"Verificados: "
                              f"{comprobados}/{len(futuros)} "
                              f"| HLS candidatos: "
                              f"{len(validos)}",
                              flush=True
                          )

              # =================================
              # PROTEGER LISTA ANTERIOR
              # =================================

              anteriores = 0

              if SALIDA.exists():
                  anteriores = sum(
                      1
                      for linea in SALIDA.read_text(
                          encoding="utf-8-sig"
                      ).splitlines()
                      if linea.startswith("#EXTINF:")
                  )

              minimo = (
                  max(
                      10,
                      math.ceil(
                          anteriores * MIN_RETENCION
                      )
                  )
                  if anteriores
                  else 10
              )

              if len(validos) < minimo:
                  raise RuntimeError(
                      f"Solo {len(validos)} "
                      f"canales verificados. "
                      f"Minimo de seguridad: {minimo}. "
                      "No se reemplaza la lista."
                  )

              # =================================
              # GENERAR M3U SIN DUPLICADOS
              # =================================

              validos.sort(
                  key=lambda canal: (
                      ORDEN.get(
                          canal["pais"],
                          999
                      ),
                      canal["nombre"].lower()
                  )
              )

              finales = []
              urls = set()

              for canal in validos:
                  if canal["url"] in urls:
                      continue

                  urls.add(canal["url"])
                  finales.append(canal)

              contenido = ["#EXTM3U"]

              for canal in finales:
                  pais = canal["pais"]

                  categoria = (
                      INTERNACIONALES
                      if pais == "INT"
                      else PAISES[pais]
                  )

                  atributos = canal["atributos"]

                  propiedades = [
                      '-1'
                  ]

                  for atributo in (
                      "tvg-id",
                      "tvg-name",
                      "tvg-logo"
                  ):
                      valor = atributos.get(
                          atributo, ""
                      ).replace('"', "")

                      if valor:
                          propiedades.append(
                              f'{atributo}="{valor}"'
                          )

                  propiedades.append(
                      f'group-title="{categoria}"'
                  )

                  nombre = canal[
                      "nombre"
                  ].replace("\n", " ").replace(
                      "\r", " "
                  )

                  contenido.append(
                      "#EXTINF:" +
                      " ".join(propiedades) +
                      "," + nombre
                  )

                  contenido.append(
                      canal["url"]
                  )

              SALIDA.write_text(
                  "\n".join(contenido) + "\n",
                  encoding="utf-8"
              )

              print(
                  "\n========== RESULTADOS =========="
              )

              print(
                  f"Canales anteriores: {anteriores}"
              )

              print(
                  f"Canales nuevos verificados: "
                  f"{len(finales)}"
              )

              for pais in list(PAISES) + ["INT"]:
                  cantidad = sum(
                      1
                      for canal in finales
                      if canal["pais"] == pais
                  )

                  if cantidad:
                      titulo = (
                          INTERNACIONALES
                          if pais == "INT"
                          else PAISES[pais]
                      )

                      print(
                          f"{titulo}: {cantidad}"
                      )

              print(
                  "\n✅ LISTA M3U GENERADA",
                  flush=True
              )

              print(
                  "IMPORTANTE: La comprobacion "
                  "no garantiza reproduccion "
                  "desde Nicaragua o Chrome."
              )

          if __name__ == "__main__":
              principal()
          PYTHON

          python actualizar_iptv_temp.py

      - name: Limpiar script temporal
        if: always()
        run: rm -f actualizar_iptv_temp.py

      - name: Publicar lista actualizada
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add latam_centroamerica_internacionales.m3u

          if git diff --cached --quiet; then
            echo "No hay cambios en la lista"
          else
            git commit -m "Actualizar canales Nicaragua Centroamerica LATAM"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
