name: Actualizar playlist IPTV

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generar playlist
        shell: python
        run: |
          import json
          import urllib.request
          import urllib.error
          import socket
          from collections import defaultdict

          CHANNELS_URL = "https://iptv-org.github.io/api/channels.json"
          STREAMS_URL = "https://iptv-org.github.io/api/streams.json"

          print("Descargando información de IPTV-org...")

          def descargar(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode("utf-8"))

          channels = descargar(CHANNELS_URL)
          streams = descargar(STREAMS_URL)

          print(f"Canales encontrados: {len(channels)}")
          print(f"Streams encontrados: {len(streams)}")

          # Información de canales
          channel_info = {
              c["id"]: c
              for c in channels
              if c.get("id")
          }

          # Países que queremos
          paises = {
              "ni": "🇳🇮 Nicaragua",
              "sv": "🇸🇻 El Salvador",
              "hn": "🇭🇳 Honduras",
              "gt": "🇬🇹 Guatemala",
              "cr": "🇨🇷 Costa Rica",
              "pa": "🇵🇦 Panamá",
              "mx": "🇲🇽 México",
              "co": "🇨🇴 Colombia",
              "ve": "🇻🇪 Venezuela",
              "ec": "🇪🇨 Ecuador",
              "pe": "🇵🇪 Perú",
              "cl": "🇨🇱 Chile",
              "ar": "🇦🇷 Argentina",
              "uy": "🇺🇾 Uruguay",
              "py": "🇵🇾 Paraguay",
              "bo": "🇧🇴 Bolivia",
              "do": "🇩🇴 República Dominicana",
              "pr": "🇵🇷 Puerto Rico"
          }

          # Timeout corto para no tardar demasiado
          socket.setdefaulttimeout(8)

          def probar_stream(url):
              """
              Comprueba que el servidor entregue datos.
              No intenta saltarse geobloqueos ni autenticación.
              """

              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )

                  with urllib.request.urlopen(req, timeout=8) as response:

                      codigo = response.status
                      content_type = response.headers.get(
                          "Content-Type", ""
                      ).lower()

                      if codigo < 200 or codigo >= 400:
                          return False

                      # Leer una pequeña cantidad de datos
                      datos = response.read(2048)

                      if not datos:
                          return False

                      # HLS normalmente contiene #EXTM3U
                      if ".m3u8" in url.lower():
                          if b"#EXTM3U" in datos:
                              return True

                      # Para otros streams basta comprobar
                      # que el servidor entregue contenido.
                      return True

              except Exception:
                  return False

          # Agrupar streams por canal
          streams_por_canal = defaultdict(list)

          for stream in streams:

              channel_id = stream.get("channel")

              if not channel_id:
                  continue

              if channel_id not in channel_info:
                  continue

              # No utilizar streams que IPTV-org marca como
              # bloqueados/geobloqueados.
              labels = stream.get("labels") or []

              labels_text = " ".join(
                  str(x).lower()
                  for x in labels
              )

              if any(x in labels_text for x in [
                  "geo-blocked",
                  "geoblocked",
                  "blocked",
                  "timeout",
                  "error"
              ]):
                  continue

              # Algunos registros antiguos pueden tener status
              status = str(
                  stream.get("status", "")
              ).lower()

              if status in [
                  "blocked",
                  "timeout",
                  "error"
              ]:
                  continue

              url = stream.get("url")

              if not url:
                  continue

              streams_por_canal[channel_id].append(stream)

          print("Streams candidatos:", sum(
              len(v) for v in streams_por_canal.values()
          ))

          # Playlist final
          playlist = [
              "#EXTM3U"
          ]

          usados = set()
          canales_ok = 0
          streams_ok = 0

          # Ordenar por país y nombre
          candidatos = []

          for channel_id, lista in streams_por_canal.items():

              canal = channel_info[channel_id]

              pais = str(
                  canal.get("country", "")
              ).lower()

              if pais not in paises:
                  continue

              candidatos.append(
                  (pais, canal, lista)
              )

          candidatos.sort(
              key=lambda x: (
                  x[0],
                  x[1].get("name", "")
              )
          )

          for pais, canal, lista in candidatos:

              nombre = canal.get(
                  "name",
                  channel_id
              )

              # Ordenar streams:
              # primero mayor calidad
              lista.sort(
                  key=lambda s: (
                      s.get("quality") or "",
                      s.get("url") or ""
                  ),
                  reverse=True
              )

              stream_valido = None

              # Probar cada stream hasta encontrar uno funcional
              for stream in lista:

                  url = stream.get("url")

                  if not url:
                      continue

                  if url in usados:
                      continue

                  print(
                      f"Probando: {nombre} -> {url}"
                  )

                  if probar_stream(url):
                      stream_valido = stream
                      break

              if not stream_valido:
                  print(
                      f"DESCARTADO: {nombre}"
                  )
                  continue

              url = stream_valido["url"]

              usados.add(url)

              calidad = (
                  stream_valido.get("quality")
                  or ""
              )

              # Crear título
              titulo = nombre

              if calidad:
                  titulo = f"{nombre} ({calidad})"

              grupo = paises[pais]

              playlist.append(
                  f'#EXTINF:-1 tvg-id="{channel_id}" '
                  f'group-title="{grupo}",{titulo}'
              )

              # Usar headers públicos solamente si IPTV-org
              # los declara para ese stream.
              referrer = stream_valido.get("referrer")
              user_agent = stream_valido.get("user_agent")

              if referrer:
                  playlist.append(
                      f"#EXTVLCOPT:http-referrer={referrer}"
                  )

              if user_agent:
                  playlist.append(
                      f"#EXTVLCOPT:http-user-agent={user_agent}"
                  )

              playlist.append(url)

              streams_ok += 1
              canales_ok += 1

          # Guardar
          with open(
              "playlist.m3u",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  "\n".join(playlist)
                  + "\n"
              )

          print("")
          print("==============================")
          print("PLAYLIST GENERADA")
          print("==============================")
          print(f"Canales activos: {canales_ok}")
          print(f"Streams activos: {streams_ok}")
          print(f"URLs únicas: {len(usados)}")
          print("==============================")

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u

          if git diff --cached --quiet; then
            echo "No hubo cambios."
          else
            git commit -m "Actualizar playlist - streams activos"
            git push
          fi
