name: Actualizar IPTV Nicaragua Claro Tigo LATAM

on:
  workflow_dispatch:
  schedule:
    - cron: "20 12 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-iptv
  cancel-in-progress: false

jobs:
  actualizar:
    name: Buscar canales en espanol
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar y verificar canales
        shell: bash
        run: |
          cat > /tmp/actualizar_iptv.py <<'PYTHON'
          import re
          import time
          import ipaddress
          import urllib.request
          import urllib.parse
          from pathlib import Path
          from collections import defaultdict
          from concurrent.futures import (
              ThreadPoolExecutor,
              as_completed
          )

          # ===================================
          # CONFIGURACION
          # ===================================

          SALIDA = Path(
              "latam_centroamerica_internacionales.m3u"
          )

          INFORME = Path(
              "reporte_actualizacion_iptv.txt"
          )

          BASE = "https://iptv-org.github.io/iptv"

          TRABAJADORES = 16
          TIMEOUT = 8
          MAX_ALTERNATIVAS = 3

          # No sustituir enlaces antiguos
          # sin revisar su reproduccion.
          CONSERVAR_ANTERIORES = True

          # ===================================
          # PAISES PERMITIDOS
          # ===================================

          PAISES = {
              "NI": "Nicaragua",
              "HN": "Honduras",
              "SV": "El Salvador",
              "GT": "Guatemala",
              "CR": "Costa Rica",
              "PA": "Panamá",
              "BZ": "Belice",
              "MX": "México",
              "AR": "Argentina",
              "BO": "Bolivia",
              "CL": "Chile",
              "CO": "Colombia",
              "EC": "Ecuador",
              "PE": "Perú",
              "PY": "Paraguay",
              "UY": "Uruguay",
              "VE": "Venezuela",
              "CU": "Cuba",
              "DO": "República Dominicana",
              "PR": "Puerto Rico",
              "HT": "Haití",
          }

          CENTROAMERICA = [
              "NI", "HN", "SV", "GT",
              "CR", "PA", "BZ"
          ]

          LATAM = [
              "MX", "CO", "AR", "PE",
              "CL", "EC", "VE", "BO",
              "PY", "UY", "DO", "PR"
          ]

          # ===================================
          # CANALES PRIORITARIOS
          # ===================================

          # Estos nombres ayudan a priorizar
          # coincidencias con canales conocidos
          # en television de Nicaragua y LATAM.
          #
          # No representan una lista oficial
          # ni otorgan acceso a Claro o Tigo.

          PRIORITARIOS = [
              "canal 10",
              "tn8",
              "canal 13",
              "viva nicaragua",
              "canal 2",
              "canal 4",
              "canal 6",
              "canal 8",
              "canal 12",
              "canal 14",
              "telemundo",
              "univision",
              "tv azteca",
              "azteca uno",
              "azteca 7",
              "las estrellas",
              "canal 5",
              "cnn en espanol",
              "telesur",
              "caracol",
              "rcn",
              "teleantioquia",
              "tv peru",
              "america television",
              "latina",
              "panamericana",
          ]

          # ===================================
          # FUENTES DE BUSQUEDA
          # ===================================

          FUENTES = [
              (f"{BASE}/languages/spa.m3u", None),
              (f"{BASE}/regions/cenamer.m3u", None),
              (f"{BASE}/regions/latam.m3u", None),
              (f"{BASE}/index.country.m3u", None),
          ]

          for codigo in CENTROAMERICA + LATAM:
              FUENTES.append((
                  f"{BASE}/countries/{codigo.lower()}.m3u",
                  codigo
              ))

          # ===================================
          # UTILIDADES
          # ===================================

          def normalizar(valor):
              import unicodedata

              texto = unicodedata.normalize(
                  "NFKD", str(valor or "")
              )

              texto = "".join(
                  c for c in texto
                  if not unicodedata.combining(c)
              )

              return re.sub(
                  r"[^a-z0-9]+", " ",
                  texto.lower()
              ).strip()

          def url_segura(url):
              try:
                  p = urllib.parse.urlsplit(url)

                  if (
                      p.scheme not in ("http", "https")
                      or not p.hostname
                      or p.username
                      or p.password
                  ):
                      return False

                  host = p.hostname.lower()

                  if (
                      host == "localhost"
                      or host.endswith(".local")
                      or host.endswith(".internal")
                  ):
                      return False

                  try:
                      ip = ipaddress.ip_address(host)
                      return ip.is_global

                  except ValueError:
                      return True

              except Exception:
                  return False

          class RedirectSeguro(
              urllib.request.HTTPRedirectHandler
          ):
              def redirect_request(
                  self, req, fp, code, msg,
                  headers, newurl
              ):
                  if not url_segura(newurl):
                      raise ValueError(
                          "Redireccion insegura"
                      )

                  return super().redirect_request(
                      req, fp, code, msg,
                      headers, newurl
                  )

          ABRIDOR = urllib.request.build_opener(
              RedirectSeguro()
          )

          def descargar(
              url,
              limite=500000,
              timeout=TIMEOUT,
              segmento=False
          ):
              if not url_segura(url):
                  raise ValueError("URL no valida")

              headers = {
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "*/*",
              }

              if segmento:
                  headers["Range"] = "bytes=0-2047"

              peticion = urllib.request.Request(
                  url, headers=headers
              )

              with ABRIDOR.open(
                  peticion,
                  timeout=timeout
              ) as respuesta:

                  final = respuesta.geturl()

                  if not url_segura(final):
                      raise ValueError(
                          "Destino no valido"
                      )

                  data = respuesta.read(
                      limite + 1
                  )

                  if not data or len(data) > limite:
                      raise ValueError(
                          "Respuesta vacia o excesiva"
                      )

                  if data.lstrip().lower().startswith(
                      (b"<html", b"<!doctype")
                  ):
                      raise ValueError(
                          "Respuesta HTML"
                      )

                  return data, final

          # ===================================
          # LEER M3U
          # ===================================

          ATRIBUTOS = re.compile(
              r'([\w-]+)="([^"]*)"'
          )

          def separar_extinf(linea):
              dentro = False

              for i, caracter in enumerate(linea):
                  if caracter == '"':
                      dentro = not dentro

                  elif caracter == "," and not dentro:
                      return (
                          linea[:i],
                          linea[i + 1:].strip()
                      )

              return None, None

          def leer_m3u(datos):
              texto = datos.decode(
                  "utf-8-sig", errors="replace"
              )

              if not texto.lstrip().startswith("#EXTM3U"):
                  raise ValueError(
                      "Lista M3U incorrecta"
                  )

              meta = None

              for original in texto.splitlines():
                  linea = original.strip()

                  if linea.startswith("#EXTINF:"):
                      izquierda, nombre = (
                          separar_extinf(linea)
                      )

                      if not izquierda or not nombre:
                          meta = None
                          continue

                      meta = {
                          "nombre": nombre,
                          "atributos": dict(
                              ATRIBUTOS.findall(
                                  izquierda
                              )
                          )
                      }

                  elif (
                      meta
                      and linea
                      and not linea.startswith("#")
                  ):
                      if url_segura(linea):
                          yield {
                              **meta,
                              "url": linea
                          }

                      meta = None

          # ===================================
          # CLASIFICAR CANALES
          # ===================================

          def pais_de(canal, origen=None):
              a = canal["atributos"]

              tvgid = a.get(
                  "tvg-id", ""
              ).split("@")[0]

              encontrado = re.search(
                  r"\.([a-z]{2})$",
                  tvgid,
                  re.I
              )

              codigo = (
                  encontrado.group(1).upper()
                  if encontrado else ""
              )

              etiquetas = set(
                  re.split(
                      r"[,;/\s]+",
                      a.get(
                          "tvg-country", ""
                      ).upper()
                  )
              )

              grupo = normalizar(
                  a.get("group-title", "")
              )

              if (
                  codigo == "BR"
                  or "BR" in etiquetas
                  or "brasil" in grupo
                  or "brazil" in grupo
              ):
                  return None

              if codigo in PAISES:
                  return codigo

              for c in PAISES:
                  if c in etiquetas:
                      return c

              for c, nombre in PAISES.items():
                  if grupo == normalizar(nombre):
                      return c

              if origen in PAISES:
                  return origen

              if (
                  origen is None
                  and a.get(
                      "tvg-language", ""
                  ).lower() in (
                      "spa", "es", "espanol",
                      "español", "spanish"
                  )
              ):
                  return "INT"

              return None

          def nombre_clave(canal):
              a = canal["atributos"]

              identificador = a.get(
                  "tvg-id", ""
              ).split("@")[0]

              if identificador:
                  return normalizar(
                      identificador
                  )

              nombre = re.sub(
                  r"\s*\((?:\d{3,4}[pi]|"
                  r"hd|sd|fhd|uhd|4k)\)",
                  "",
                  canal["nombre"],
                  flags=re.I
              )

              return normalizar(nombre)

          def clave(canal):
              return (
                  canal["pais"],
                  nombre_clave(canal)
              )

          def prioridad(canal):
              nombre = normalizar(
                  canal["nombre"]
              )

              destacado = any(
                  normalizar(p) in nombre
                  for p in PRIORITARIOS
              )

              return (
                  canal["pais"] == "NI",
                  canal["pais"] in CENTROAMERICA,
                  destacado,
                  canal["url"].startswith(
                      "https://"
                  )
              )

          # ===================================
          # VERIFICAR HLS
          # ===================================

          def comprobar_hls(
              url,
              nivel=0,
              visitados=None
          ):
              if nivel > 3:
                  return False

              visitados = set(
                  visitados or []
              )

              if url in visitados:
                  return False

              visitados.add(url)

              try:
                  datos, final = descargar(
                      url, limite=400000
                  )

                  lineas = [
                      x.strip()
                      for x in datos.decode(
                          "utf-8-sig",
                          errors="replace"
                      ).splitlines()
                      if x.strip()
                  ]

                  if (
                      not lineas
                      or lineas[0] != "#EXTM3U"
                  ):
                      return False

                  if not any(
                      x.startswith("#EXT-X-")
                      for x in lineas
                  ):
                      return False

                  # No intentar eludir DRM
                  for linea in lineas:
                      if linea.startswith(
                          "#EXT-X-KEY:"
                      ):
                          if "METHOD=NONE" not in linea:
                              return False

                  variantes = []

                  for i, linea in enumerate(lineas):
                      if linea.startswith(
                          "#EXT-X-STREAM-INF:"
                      ):
                          siguientes = lineas[i + 1:]

                          for siguiente in siguientes:
                              if not siguiente.startswith("#"):
                                  variantes.append(
                                      urllib.parse.urljoin(
                                          final, siguiente
                                      )
                                  )
                                  break

                  if variantes:
                      for alternativa in variantes[:3]:
                          if comprobar_hls(
                              alternativa,
                              nivel + 1,
                              visitados
                          ):
                              return True

                      return False

                  if not any(
                      x.startswith("#EXTINF:")
                      for x in lineas
                  ):
                      return False

                  # Verificar inicializacion fMP4
                  for linea in lineas:
                      if linea.startswith(
                          "#EXT-X-MAP:"
                      ):
                          m = re.search(
                              r'URI="([^"]+)"',
                              linea
                          )

                          if m:
                              descargar(
                                  urllib.parse.urljoin(
                                      final, m.group(1)
                                  ),
                                  limite=2048,
                                  segmento=True
                              )

                  segmentos = [
                      x for x in lineas
                      if not x.startswith("#")
                  ]

                  for segmento in reversed(
                      segmentos[-3:]
                  ):
                      try:
                          descargar(
                              urllib.parse.urljoin(
                                  final, segmento
                              ),
                              limite=2048,
                              segmento=True
                          )
                          return True

                      except Exception:
                          continue

              except Exception:
                  return False

              return False

          def verificar_grupo(grupo):
              _, opciones = grupo

              for canal in opciones[
                  :MAX_ALTERNATIVAS
              ]:
                  if comprobar_hls(canal["url"]):
                      return canal

              return None

          # ===================================
          # PROTEGER CANALES ANTERIORES
          # ===================================

          def leer_anteriores():
              if not SALIDA.exists():
                  return []

              try:
                  datos = SALIDA.read_bytes()
                  anteriores = []

                  for canal in leer_m3u(datos):
                      grupo = normalizar(
                          canal["atributos"].get(
                              "group-title", ""
                          )
                      )

                      pais = None

                      for codigo, nombre in PAISES.items():
                          if (
                              grupo == normalizar(nombre)
                              or grupo.endswith(
                                  " " + normalizar(nombre)
                              )
                          ):
                              pais = codigo
                              break

                      if pais is None:
                          if "internacional" in grupo:
                              pais = "INT"

                      if pais:
                          canal["pais"] = pais
                          anteriores.append(canal)

                  return anteriores

              except Exception as error:
                  print(
                      "AVISO: lista anterior:",
                      error
                  )
                  return []

          # ===================================
          # GENERAR LISTA FINAL
          # ===================================

          def generar_m3u(canales):
              lineas = ["#EXTM3U"]

              for canal in canales:
                  pais = canal["pais"]

                  categoria = (
                      "Internacionales"
                      if pais == "INT"
                      else PAISES[pais]
                  )

                  a = canal["atributos"]

                  datos = ["-1"]

                  for campo in (
                      "tvg-id",
                      "tvg-name",
                      "tvg-logo"
                  ):
                      valor = a.get(
                          campo, ""
                      ).replace('"', "")

                      if valor:
                          datos.append(
                              f'{campo}="{valor}"'
                          )

                  datos.append(
                      f'group-title="{categoria}"'
                  )

                  nombre = (
                      canal["nombre"]
                      .replace("\r", " ")
                      .replace("\n", " ")
                  )

                  lineas.append(
                      "#EXTINF:" +
                      " ".join(datos) +
                      "," + nombre
                  )

                  lineas.append(
                      canal["url"]
                  )

              return "\n".join(lineas) + "\n"

          # ===================================
          # PROCESO PRINCIPAL
          # ===================================

          def principal():
              inicio = time.monotonic()

              print(
                  "\nACTUALIZACION IPTV NICARAGUA"
              )

              print(
                  "Busqueda de canales "
                  "en espanol y LATAM"
              )

              anteriores = leer_anteriores()

              print(
                  "Canales anteriores:",
                  len(anteriores),
                  flush=True
              )

              grupos = defaultdict(list)
              urls_entrada = set()
              fuentes_ok = 0

              for url, origen in FUENTES:
                  try:
                      datos, _ = descargar(
                          url,
                          limite=20000000,
                          timeout=30
                      )

                      lista = list(
                          leer_m3u(datos)
                      )

                      fuentes_ok += 1

                      aceptados = 0

                      for canal in lista:
                          pais = pais_de(
                              canal, origen
                          )

                          if not pais:
                              continue

                          canal["pais"] = pais

                          llave_url = (
                              pais, canal["url"]
                          )

                          if llave_url in urls_entrada:
                              continue

                          urls_entrada.add(llave_url)

                          grupos[
                              clave(canal)
                          ].append(canal)

                          aceptados += 1

                      print(
                          "FUENTE OK:",
                          aceptados,
                          url,
                          flush=True
                      )

                  except Exception as error:
                      print(
                          "FUENTE ERROR:",
                          url,
                          str(error)[:120],
                          flush=True
                      )

              if fuentes_ok == 0 or not grupos:
                  raise RuntimeError(
                      "No se encontraron fuentes. "
                      "Se conserva la lista anterior."
                  )

              # Priorizar Nicaragua y canales
              # conocidos en television LATAM.

              trabajos = []

              for k, opciones in grupos.items():
                  opciones.sort(
                      key=prioridad,
                      reverse=True
                  )

                  trabajos.append(
                      (k, opciones)
                  )

              print(
                  "Canales candidatos:",
                  len(trabajos),
                  flush=True
              )

              nuevos_verificados = []

              with ThreadPoolExecutor(
                  max_workers=TRABAJADORES
              ) as executor:

                  futuros = [
                      executor.submit(
                          verificar_grupo,
                          grupo
                      )
                      for grupo in trabajos
                  ]

                  revisados = 0

                  for futuro in as_completed(
                      futuros
                  ):
                      revisados += 1

                      canal = futuro.result()

                      if canal:
                          nuevos_verificados.append(
                              canal
                          )

                      if (
                          revisados % 100 == 0
                          or revisados == len(futuros)
                      ):
                          print(
                              "Revisados:",
                              revisados,
                              "/",
                              len(futuros),
                              "| HLS:",
                              len(nuevos_verificados),
                              flush=True
                          )

              # Mantener primero los enlaces
              # que ya estaban publicados.

              finales = []
              claves = set()
              urls = set()

              def agregar(canal):
                  k = clave(canal)

                  if (
                      k in claves
                      or canal["url"] in urls
                  ):
                      return False

                  claves.add(k)
                  urls.add(canal["url"])
                  finales.append(canal)

                  return True

              conservados = 0
              incorporados = 0

              if CONSERVAR_ANTERIORES:
                  for canal in anteriores:
                      if agregar(canal):
                          conservados += 1

              for canal in nuevos_verificados:
                  if agregar(canal):
                      incorporados += 1

              if len(finales) < 10:
                  raise RuntimeError(
                      "Demasiados pocos canales. "
                      "No se modifica la lista."
                  )

              # Evitar que un fallo temporal
              # quite los canales anteriores.

              if (
                  anteriores
                  and len(finales)
                  < len(anteriores) * 0.90
              ):
                  raise RuntimeError(
                      "Caida considerable del catalogo. "
                      "Se conserva el archivo anterior."
                  )

              orden = {
                  codigo: indice
                  for indice, codigo
                  in enumerate(PAISES)
              }

              finales.sort(
                  key=lambda canal: (
                      orden.get(
                          canal["pais"], 999
                      ),
                      canal["nombre"].lower()
                  )
              )

              SALIDA.write_text(
                  generar_m3u(finales),
                  encoding="utf-8"
              )

              resumen = [
                  "ACTUALIZACION IPTV",
                  "======================",
                  f"Fuentes correctas: {fuentes_ok}",
                  f"Candidatos: {len(trabajos)}",
                  f"Anteriores: {len(anteriores)}",
                  f"Conservados: {conservados}",
                  f"HLS comprobados: "
                  f"{len(nuevos_verificados)}",
                  f"Incorporados: {incorporados}",
                  f"Total publicado: {len(finales)}",
                  "",
              ]

              for codigo, nombre in PAISES.items():
                  cantidad = sum(
                      c["pais"] == codigo
                      for c in finales
                  )

                  if cantidad:
                      resumen.append(
                          f"{nombre}: {cantidad}"
                      )

              internacionales = sum(
                  c["pais"] == "INT"
                  for c in finales
              )

              if internacionales:
                  resumen.append(
                      "Internacionales: "
                      f"{internacionales}"
                  )

              resumen.append(
                  f"Duracion: "
                  f"{round(time.monotonic()-inicio)} s"
              )

              INFORME.write_text(
                  "\n".join(resumen) + "\n",
                  encoding="utf-8"
              )

              print(
                  "\n".join(resumen),
                  flush=True
              )

              print(
                  "\nLISTA GENERADA CORRECTAMENTE"
              )

              print(
                  "NOTA: Los canales conservados "
                  "no se vuelven a verificar. "
                  "HLS OK tampoco garantiza "
                  "reproduccion en Chrome."
              )

          if __name__ == "__main__":
              principal()
          PYTHON

          python /tmp/actualizar_iptv.py

      - name: Publicar lista e informe
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add latam_centroamerica_internacionales.m3u
          git add reporte_actualizacion_iptv.txt

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar"
          else
            git commit -m "Actualizar IPTV espanol Nicaragua LATAM"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
