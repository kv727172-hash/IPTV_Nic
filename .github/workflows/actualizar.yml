                          if match:
                              fetch(urllib.parse.urljoin(url,match.group(1)),2048,8,True)
                  segments = [x for x in lines if not x.startswith('#')]
                  for segment in segments[-3:]:
                      try:
                          fetch(urllib.parse.urljoin(url,segment),2048,8,True)
                          return True
                      except Exception:
                          pass
              except Exception:
                  pass
              return False

          def main():
              if not OUT.exists():
                  raise RuntimeError('Falta la lista anterior; se detiene para proteger canales')
              previous = list(parse_m3u(OUT.read_bytes()))
              if len(previous) < 10:
                  raise RuntimeError('Lista anterior demasiado pequeña; no se modifica')
              existing_urls = {x['url'] for x in previous}
              existing_keys = set()
              for x in previous:
                  c = country(x,None)
                  if c:
                      x['country'] = c
                      existing_keys.add(key(x))
              found = defaultdict(list)
              sources_ok = 0
              for url, origin in SOURCES:
                  try:
                      entries = list(parse_m3u(fetch(url,20_000_000,30)))
                      sources_ok += 1
                      for x in entries:
                          c = country(x,origin)
                          if not c or not is_spanish(x): continue
                          x['country'] = c
                          if x['url'] in existing_urls or key(x) in existing_keys: continue
                          found[key(x)].append(x)
                      print('FUENTE OK:',len(entries),url,flush=True)
                  except Exception as exc:
                      print('FUENTE NO DISPONIBLE:',url,str(exc)[:90],flush=True)
              if not sources_ok:
                  raise RuntimeError('Ninguna fuente respondio; se conserva M3U')
              order = ['NI','HN','SV','GT','CR','PA','BZ']
              candidates = []
              for k, choices in found.items():
                  unique = list({x['url']:x for x in choices}.values())
                  unique.sort(key=lambda x:x['url'].startswith('https://'),reverse=True)
                  candidates.append((k,unique[:3]))
              candidates.sort(key=lambda item:(order.index(item[0][0]) if item[0][0] in order else 99,item[0]))
              candidates = candidates[:MAX_CHECK]
              def check(item):
                  for x in item[1]:
                      if hls(x['url']): return x
                  return None
              checked = []
              with cf.ThreadPoolExecutor(max_workers=WORKERS) as pool:
                  for n,x in enumerate(pool.map(check,candidates),1):
                      if x: checked.append(x)
                      if n % 100 == 0: print('Verificados:',n,'Nuevos HLS:',len(checked),flush=True)
              # Se conservan todos los enlaces anteriores, incluso si fallan hoy.
              final = previous[:]
              for x in checked:
                  if x['url'] in existing_urls or key(x) in existing_keys: continue
                  existing_urls.add(x['url'])
                  existing_keys.add(key(x))
                  group = COUNTRIES[x['country']]
                  attrs = x['attr']
                  parts = ['-1']
                  for field in ('tvg-id','tvg-name','tvg-logo'):
                      if attrs.get(field):
                          parts.append(f'{field}="{attrs[field].replace(chr(34), "")}"')
                  parts.append(f'group-title="{group}"')
                  name = x['name'].replace('\n',' ').replace('\r',' ')
                  x['extinf'] = '#EXTINF:'+' '.join(parts)+','+name
                  final.append(x)
              lines = ['#EXTM3U']
              for x in final:
                  lines.extend((x['extinf'],x['url']))
              OUT.write_text('\n'.join(lines)+'\n',encoding='utf-8')
              channel_id = 'UCf4d3_6a-NpmZy6q_F9U8MA'
              playlist_id = 'UU'+channel_id[2:]
              YOTA.write_text(json.dumps({
                  'name':'Yota TV',
                  'category':'Publicidad',
                  'type':'youtube_playlist',
                  'channel_url':'https://www.youtube.com/@YotaOfficialNi',
                  'playlist_id':playlist_id,
                  'embed_url':'https://www.youtube.com/embed/videoseries?list='+playlist_id+'&loop=1',
                  'note':'Reproductor oficial de YouTube; disponibilidad/insercion por verificar. No es M3U8.'
              },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              REPORT.write_text(
                  f'Fuentes disponibles: {sources_ok}/{len(SOURCES)}\n'
                  f'Canales anteriores conservados: {len(previous)}\n'
                  f'Candidatos revisados: {len(candidates)}\n'
                  f'Canales HLS nuevos: {len(final)-len(previous)}\n'
                  f'Total en M3U: {len(final)}\n'
                  'Yota: playlist de subidas preparada en yota_publicidad.json\n'
                  'Nota: HLS valido no implica reproduccion en Chrome ni permiso de redistribucion.\n',
                  encoding='utf-8'
              )
              print(REPORT.read_text(),flush=True)
          if __name__ == '__main__':
              main()
          PY
          python /tmp/iptv_update.py

