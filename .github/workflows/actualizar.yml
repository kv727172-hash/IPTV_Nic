
name: Actualizar IPTV LATAM Centroamerica e Internacionales

on:
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * *'

permissions:
  contents: write

concurrency:
  group: actualizar-iptv
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Buscar y comprobar canales
        shell: bash
        run: |
          cat > /tmp/actualizar_iptv.py <<'PY'
          import concurrent.futures
          import ipaddress
          import math
          import re
          import urllib.parse
          import urllib.request
          from collections import defaultdict
          from pathlib import Path

          OUTPUT = Path(
              'latam_centroamerica_internacionales.m3u'
          )

          ORIGIN = 'http://localhost:3000'
          TIMEOUT = 9
          WORKERS = 14
          MAX_PER_NAME = 4
          MIN_RATIO = 0.10

          SOURCES = [
              'https://iptv-org.github.io/iptv/index.m3u',
              'https://iptv-org.github.io/iptv/index.category.m3u',
          ]

          COUNTRIES = {
              'NI': 'Nicaragua',
              'HN': 'Honduras',
              'SV': 'El Salvador',
              'GT': 'Guatemala',
              'CR': 'Costa Rica',
              'PA': 'Panamá',
              'BZ': 'Belice',
              'MX': 'México',
              'AR': 'Argentina',
              'BO': 'Bolivia',
              'CL': 'Chile',
              'CO': 'Colombia',
              'EC': 'Ecuador',
              'PE': 'Perú',
              'PY': 'Paraguay',
              'UY': 'Uruguay',
              'VE': 'Venezuela',
              'CU': 'Cuba',
              'DO': 'República Dominicana',
              'PR': 'Puerto Rico',
              'HT': 'Haití',
              'GY': 'Guyana',
              'SR': 'Surinam',
              'AW': 'Aruba',
              'CW': 'Curazao',
              'BQ': 'Caribe Neerlandés',
              'SX': 'Sint Maarten',
              'MF': 'San Martín',
              'MQ': 'Martinica',
              'GP': 'Guadalupe',
              'JM': 'Jamaica',
              'TT': 'Trinidad y Tobago',
              'BS': 'Bahamas',
              'BB': 'Barbados',
              'AG': 'Antigua y Barbuda',
              'DM': 'Dominica',
              'GD': 'Granada',
              'KN': 'San Cristóbal y Nieves',
              'LC': 'Santa Lucía',
              'VC': 'San Vicente',
              'KY': 'Islas Caimán',
              'TC': 'Islas Turcas y Caicos',
              'VG': 'Islas Vírgenes Británicas',
              'VI': 'Islas Vírgenes EE.UU.',
              'AI': 'Anguila',
              'MS': 'Montserrat',
              'GF': 'Guayana Francesa',
              'BL': 'San Bartolomé',
          }

          ORDER = {
              code: index
              for index, code in enumerate(COUNTRIES)
          }

          ATTR = re.compile(
              r'([\w-]+)="([^"]*)"'
          )

          INTL = re.compile(
              r'\b(international|internacional|'
              r'internacionales|world|global)\b',
              re.I
          )

          def safe(url):
              try:
                  p = urllib.parse.urlsplit(url)

                  if (
                      p.scheme not in ('http', 'https')
                      or not p.hostname
                      or p.username
                      or p.password
                  ):
                      return False

                  h = p.hostname.lower()

                  if (
                      h == 'localhost'
                      or h.endswith('.local')
                      or h.endswith('.internal')
                  ):
                      return False

                  try:
                      ip = ipaddress.ip_address(h)
                      return ip.is_global

                  except ValueError:
                      return True

              except ValueError:
                  return False

          class SafeRedirect(
              urllib.request.HTTPRedirectHandler
          ):
              def redirect_request(
                  self,
                  req,
                  fp,
                  code,
                  msg,
                  headers,
                  newurl
              ):
                  if not safe(newurl):
                      raise ValueError(
                          'Redirección insegura'
                      )

                  return super().redirect_request(
                      req,
                      fp,
                      code,
                      msg,
                      headers,
                      newurl
                  )

          OPENER = urllib.request.build_opener(
              SafeRedirect()
          )

          def fetch(
              url,
              limit,
              origin=False,
              binary=False
          ):
              if not safe(url):
                  raise ValueError(
                      'URL no válida'
                  )

              headers = {
                  'User-Agent':
                      'IPTV-Nic-Checker/2.0',
                  'Accept': '*/*',
              }

              if origin:
                  headers['Origin'] = ORIGIN

              if binary:
                  headers['Range'] = (
                      'bytes=0-2047'
                  )

              req = urllib.request.Request(
                  url,
                  headers=headers
              )

              timeout = (
                  TIMEOUT if origin else 35
              )

              with OPENER.open(
                  req,
                  timeout=timeout
              ) as r:

                  final = r.geturl()

                  if not safe(final):
                      raise ValueError(
                          'Redirección inválida'
                      )

                  cors = r.headers.get(
                      'Access-Control-Allow-Origin',
                      ''
                  )

                  if (
                      origin
                      and cors not in ('*', ORIGIN)
                  ):
                      raise ValueError(
                          'CORS no disponible'
                      )

                  typ = r.headers.get(
                      'Content-Type',
                      ''
                  ).lower()

                  data = r.read(limit + 1)

                  if (
                      not data
                      or len(data) > limit
                      or 'text/html' in typ
                  ):
                      raise ValueError(
                          'Respuesta inválida'
                      )

                  if (
                      binary
                      and data.lstrip().lower()
                      .startswith(
                          (
                              b'<html',
                              b'<!doctype'
                          )
                      )
                  ):
                      raise ValueError(
                          'Segmento HTML'
                      )

                  return data, final

          def parse_m3u(data):
              info = None
              extra = []

              lines = data.decode(
                  'utf-8-sig',
                  errors='replace'
              ).splitlines()

              for raw in lines:
                  line = raw.strip()

                  if line.startswith(
                      '#EXTINF:'
                  ):
                      info = line
                      extra = []

                  elif info:
                      if line.startswith('#'):
                          extra.append(line)

                      elif line:
                          if (
                              safe(line)
                              and ',' in info
                          ):
                              left, name = (
                                  info.split(',', 1)
                              )

                              yield {
                                  'meta': left,
                                  'name': name.strip(),
                                  'props': dict(
                                      ATTR.findall(left)
                                  ),
                                  'url': line,
                                  'extra': extra[:]
                              }

                          info = None
                          extra = []

          def classify(e):
              p = e['props']

              tvgid = p.get(
                  'tvg-id',
                  ''
              ).split('@')[0]

              suffix = re.search(
                  r'\.([a-z]{2})$',
                  tvgid,
                  re.I
              )

              country = (
                  suffix.group(1).upper()
                  if suffix
                  else ''
              )

              tags = set(
                  re.split(
                      r'[,; /]+',
                      p.get(
                          'tvg-country',
                          ''
                      ).upper()
                  )
              )

              group = p.get(
                  'group-title',
                  ''
              ).lower()

              if (
                  country == 'BR'
                  or 'BR' in tags
                  or 'brasil' in group
                  or 'brazil' in group
              ):
                  return None

              if country in COUNTRIES:
                  return country

              for code, title in (
                  COUNTRIES.items()
              ):
                  if (
                      code in tags
                      or group.strip()
                      == title.lower()
                  ):
                      return code

              if (
                  'INT' in tags
                  or INTL.search(e['name'])
                  or 'international' in group
                  or 'internacional' in group
              ):
                  return 'INT'

              return None

          def name_key(e):
              tvgid = e['props'].get(
                  'tvg-id',
                  ''
              ).split('@')[0]

              if tvgid:
                  return tvgid.lower()

              return re.sub(
                  r'[^a-z0-9]',
                  '',
                  e['name'].lower()
              )

          def priority(e):
              q = re.search(
                  r'\((\d{3,4})[pi]\)',
                  e['name'],
                  re.I
              )

              blocked = (
                  '[geo.blocked]'
                  in e['name'].lower()
              )

              return (
                  not blocked,
                  e['url'].startswith(
                      'https://'
                  ),
                  int(q.group(1))
                  if q
                  else 0
              )

          def hls(
              url,
              depth=0,
              seen=None
          ):
              if depth > 3:
                  return False

              seen = (
                  set()
                  if seen is None
                  else set(seen)
              )

              if url in seen:
                  return False

              seen.add(url)

              try:
                  data, final = fetch(
                      url,
                      450000,
                      origin=True
                  )

                  lines = [
                      x.strip()
                      for x in data.decode(
                          'utf-8-sig',
                          errors='replace'
                      ).splitlines()
                      if x.strip()
                  ]

                  if (
                      not lines
                      or lines[0] != '#EXTM3U'
                      or not any(
                          '#EXT-X-' in x
                          for x in lines
                      )
                  ):
                      return False

                  if any(
                      x.startswith(
                          '#EXT-X-KEY:'
                      )
                      and 'METHOD=NONE'
                      not in x
                      for x in lines
                  ):
                      return False

                  variants = []

                  for i, line in enumerate(
                      lines
                  ):
                      if line.startswith(
                          '#EXT-X-STREAM-INF:'
                      ):
                          for sub in (
                              lines[i + 1:]
                          ):
                              if not sub.startswith(
                                  '#'
                              ):
                                  variants.append(
                                      urllib.parse.urljoin(
                                          final,
                                          sub
                                      )
                                  )
                                  break

                  if variants:
                      return any(
                          hls(
                              v,
                              depth + 1,
                              seen
                          )
                          for v in variants[:3]
                      )

                  if not any(
                      x.startswith(
                          '#EXTINF:'
                      )
                      for x in lines
                  ):
                      return False

                  for line in lines:
                      if line.startswith(
                          '#EXT-X-MAP:'
                      ):
                          match = re.search(
                              r'URI="([^"]+)"',
                              line
                          )

                          if match:
                              fetch(
                                  urllib.parse.urljoin(
                                      final,
                                      match.group(1)
                                  ),
                                  2048,
                                  origin=True,
                                  binary=True
                              )

                  segments = [
                      x
                      for x in lines
                      if not x.startswith('#')
                  ]

                  for segment in reversed(
                      segments[-3:]
                  ):
                      try:
                          fetch(
                              urllib.parse.urljoin(
                                  final,
                                  segment
                              ),
                              2048,
                              origin=True,
                              binary=True
                          )
                          return True

                      except Exception:
                          continue

              except Exception:
                  return False

              return False

          def check(item):
              _, options = item

              for e in options[
                  :MAX_PER_NAME
              ]:
                  if hls(e['url']):
                      return e

              return None

          def main():
              groups = defaultdict(list)
              fetched = 0

              for src in SOURCES:
                  try:
                      data, _ = fetch(
                          src,
                          18000000
                      )

                      entries = list(
                          parse_m3u(data)
                      )

                      fetched += 1

                      print(
                          f'Fuente: {len(entries)} '
                          f'entradas — {src}',
                          flush=True
                      )

                      for e in entries:
                          country = classify(e)

                          if country:
                              e['country'] = country

                              key = (
                                  country,
                                  name_key(e)
                              )

                              groups[key].append(e)

                  except Exception as ex:
                      print(
                          f'AVISO: No se pudo '
                          f'leer {src}: {ex}',
                          flush=True
                      )

              if not fetched or not groups:
                  raise RuntimeError(
                      'No hay fuentes suficientes; '
                      'se conserva la lista anterior'
                  )

              jobs = []

              for k, entries in (
                  groups.items()
              ):
                  distinct = {}

                  for e in entries:
                      old = distinct.get(
                          e['url']
                      )

                      if (
                          old is None
                          or priority(e)
                          > priority(old)
                      ):
                          distinct[e['url']] = e

                  jobs.append(
                      (
                          k,
                          sorted(
                              distinct.values(),
                              key=priority,
                              reverse=True
                          )
                      )
                  )

              print(
                  'Canales distintos '
                  f'para comprobar: {len(jobs)}',
                  flush=True
              )

              winners = []

              with concurrent.futures.ThreadPoolExecutor(
                  max_workers=WORKERS
              ) as pool:

                  for i, result in enumerate(
                      pool.map(check, jobs),
                      1
                  ):
                      if result:
                          winners.append(result)

                      if (
                          i % 100 == 0
                          or i == len(jobs)
                      ):
                          print(
                              f'{i}/{len(jobs)} '
                              'comprobados; '
                              'HLS y CORS: '
                              f'{len(winners)}',
                              flush=True
                          )

              previous = 0

              if OUTPUT.exists():
                  previous = sum(
                      1
                      for x in OUTPUT.read_text(
                          encoding='utf-8-sig'
                      ).splitlines()
                      if x.startswith(
                          '#EXTINF:'
                      )
                  )

              minimum = (
                  max(
                      10,
                      math.ceil(
                          previous * MIN_RATIO
                      )
                  )
                  if previous
                  else 10
              )

              if len(winners) < minimum:
                  raise RuntimeError(
                      f'Solo {len(winners)} '
                      'válidos de mínimo '
                      f'{minimum}; se conserva '
                      'la lista anterior'
                  )

              unique = []
              urls = set()

              for e in sorted(
                  winners,
                  key=lambda x: (
                      ORDER.get(
                          x['country'],
                          99
                      ),
                      x['name'].lower()
                  )
              ):
                  if e['url'] in urls:
                      continue

                  urls.add(e['url'])
                  unique.append(e)

              content = ['#EXTM3U']

              for e in unique:
                  title = (
                      '🌐 Internacionales'
                      if e['country'] == 'INT'
                      else COUNTRIES[
                          e['country']
                      ]
                  )

                  meta = re.sub(
                      r'\s*group-title="[^"]*"',
                      '',
                      e['meta']
                  )

                  content.append(
                      f'{meta} '
                      f'group-title="{title}",'
                      f'{e["name"]}'
                  )

                  content.extend(
                      e['extra']
                  )
                  content.append(
                      e['url']
                  )

              OUTPUT.write_text(
                  '\n'.join(content) + '\n',
                  encoding='utf-8'
              )

              print(
                  'PUBLICABLE: '
                  f'{len(unique)} canales. '
                  f'Anterior: {previous}',
                  flush=True
              )

              print(
                  'Nota: prueba desde GitHub; '
                  'el resultado puede variar '
                  'en Nicaragua o Chrome.',
                  flush=True
              )

          if __name__ == '__main__':
              main()
          PY

          python3 /tmp/actualizar_iptv.py

      - name: Publicar solo si hay cambios
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add latam_centroamerica_internacionales.m3u

          if git diff --cached --quiet; then
            echo 'Sin cambios para publicar'
          else
            git commit -m 'Actualizar lista IPTV LATAM verificada'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
