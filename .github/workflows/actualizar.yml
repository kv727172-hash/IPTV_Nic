name: Actualizar IPTV LATAM

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    # Evita que una ejecución pueda quedarse horas
    timeout-minutes: 15

    steps:

      # ==========================================
      # 1. DESCARGAR REPOSITORIO
      # ==========================================
      - name: Descargar repositorio
        uses: actions/checkout@v4


      # ==========================================
      # 2. DESCARGAR DATOS DE IPTV-ORG
      # ==========================================
      - name: Descargar datos de IPTV-org
        run: |

          curl -L --fail \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 90 \
            "https://iptv-org.github.io/api/channels.json" \
            -o channels.json

          curl -L --fail \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 90 \
            "https://iptv-org.github.io/api/streams.json" \
            -o streams.json

          echo "Datos descargados correctamente."


      # ==========================================
      # 3. GENERAR LISTA LATAM
      # ==========================================
      - name: Generar lista LATAM
        run: |

          python3 <<'PY'

          import json
          import os

          # Países considerados LATAM
          LATAM = {
              "ar",
              "bo",
              "br",
              "cl",
              "co",
              "cr",
              "cu",
              "do",
              "ec",
              "sv",
              "gt",
              "hn",
              "mx",
              "ni",
              "pa",
              "py",
              "pe",
              "pr",
              "uy",
              "ve"
          }

          with open(
              "channels.json",
              "r",
              encoding="utf-8"
          ) as f:
              channels = json.load(f)

          with open(
              "streams.json",
              "r",
              encoding="utf-8"
          ) as f:
              streams = json.load(f)


          # ------------------------------------------
          # IDENTIFICAR CANALES LATAM
          # ------------------------------------------

          canales_latam = {}

          for channel in channels:

              channel_id = channel.get("id")

              if not channel_id:
                  continue

              countries = channel.get(
                  "country",
                  []
              )

              if isinstance(countries, str):
                  countries = [countries]

              countries = {
                  str(x).lower()
                  for x in countries
              }


              broadcast = channel.get(
                  "broadcastArea",
                  []
              )

              if isinstance(broadcast, str):
                  broadcast = [broadcast]

              broadcast = {
                  str(x).lower()
                  for x in broadcast
              }


              es_latam = bool(
                  countries & LATAM
              )


              # Canales regionales LATAM
              if not es_latam:

                  for area in broadcast:

                      if (
                          "latin" in area
                          or "latam" in area
                      ):
                          es_latam = True
                          break


              if es_latam:

                  canales_latam[
                      channel_id
                  ] = channel


          print(
              "Canales LATAM:",
              len(canales_latam)
          )


          # ------------------------------------------
          # CREAR DIRECTORIO
          # ------------------------------------------

          os.makedirs(
              "listas",
              exist_ok=True
          )


          # ------------------------------------------
          # GENERAR M3U
          # ------------------------------------------

          urls = set()

          resultado = []

          resultado.append(
              "#EXTM3U\n"
          )


          for stream in streams:

              channel_id = stream.get(
                  "channel"
              )

              url = stream.get(
                  "url"
              )


              if not channel_id:
                  continue

              if not url:
                  continue


              if channel_id not in canales_latam:
                  continue


              if not url.startswith(
                  (
                      "http://",
                      "https://"
                  )
              ):
                  continue


              # Eliminar duplicados
              if url in urls:
                  continue

              urls.add(url)


              channel = canales_latam[
                  channel_id
              ]


              nombre = channel.get(
                  "name",
                  channel_id
              )


              logo = channel.get(
                  "logo",
                  ""
              )


              countries = channel.get(
                  "country",
                  []
              )


              if isinstance(
                  countries,
                  str
              ):
                  countries = [
                      countries
                  ]


              pais = (
                  countries[0].upper()
                  if countries
                  else "LATAM"
              )


              resultado.append(
                  '#EXTINF:-1 '
                  f'tvg-id="{channel_id}" '
                  f'tvg-name="{nombre}" '
                  f'tvg-logo="{logo}" '
                  f'group-title="LATAM - {pais}",'
                  f'{nombre}\n'
              )

              resultado.append(
                  url + "\n"
              )


          # ------------------------------------------
          # GUARDAR
          # ------------------------------------------

          archivo = (
              "listas/latam.m3u"
          )


          with open(
              archivo,
              "w",
              encoding="utf-8"
          ) as f:

              f.writelines(
                  resultado
              )


          print()
          print(
              "Streams encontrados:",
              len(urls)
          )

          print(
              "Archivo:",
              archivo
          )

          PY


      # ==========================================
      # 4. COMPROBAR STREAMS RÁPIDAMENTE
      # ==========================================
      - name: Comprobar streams rápidamente
        run: |

          python3 <<'PY'

          import concurrent.futures
          import urllib.request
          import socket
          import os

          entrada = (
              "listas/latam.m3u"
          )

          salida = (
              "listas/latam_activos.m3u"
          )


          # ------------------------------------------
          # LEER M3U
          # ------------------------------------------

          with open(
              entrada,
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as f:

              lineas = f.readlines()


          canales = []

          i = 0

          while i < len(lineas):

              if lineas[i].startswith(
                  "#EXTINF"
              ):

                  if i + 1 < len(lineas):

                      info = lineas[i]
                      url = lineas[i + 1].strip()

                      canales.append(
                          (
                              info,
                              url
                          )
                      )

                  i += 2

              else:

                  i += 1


          print(
              "Streams a comprobar:",
              len(canales)
          )


          # ------------------------------------------
          # COMPROBAR URL
          # ------------------------------------------

          def comprobar(item):

              info, url = item

              try:

                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                          "Mozilla/5.0"
                      }
                  )


                  with urllib.request.urlopen(
                      req,
                      timeout=5
                  ) as response:

                      codigo = response.status


                      if (
                          codigo >= 200
                          and codigo < 400
                      ):

                          return item


              except Exception:

                  pass


              return None


          # ------------------------------------------
          # COMPROBACIÓN PARALELA
          # ------------------------------------------

          activos = []


          # 30 conexiones simultáneas
          with concurrent.futures.ThreadPoolExecutor(
              max_workers=30
          ) as executor:

              resultados = executor.map(
                  comprobar,
                  canales
              )


              for resultado in resultados:

                  if resultado:

                      activos.append(
                          resultado
                      )


          # ------------------------------------------
          # CREAR LISTA FINAL
          # ------------------------------------------

          with open(
              salida,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "#EXTM3U\n"
              )


              for info, url in activos:

                  f.write(
                      info
                  )

                  f.write(
                      url + "\n"
                  )


          os.replace(
              salida,
              entrada
          )


          print()
          print(
              "================================"
          )

          print(
              "Streams originales:",
              len(canales)
          )

          print(
              "Streams activos:",
              len(activos)
          )

          print(
              "Streams eliminados:",
              len(canales) -
              len(activos)
          )

          print(
              "================================"
          )

          PY


      # ==========================================
      # 5. MOSTRAR RESULTADO
      # ==========================================
      - name: Mostrar resultado final
        run: |

          echo "===================================="
          echo "       IPTV LATAM"
          echo "===================================="

          echo "Archivo:"
          echo "listas/latam.m3u"

          echo ""

          echo "Canales finales:"

          grep -c "^#EXTINF" \
            listas/latam.m3u || true

          echo ""

          ls -lh \
            listas/latam.m3u


      # ==========================================
      # 6. GUARDAR EN GITHUB
      # ==========================================
      - name: Guardar cambios
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            listas/latam.m3u


          if git diff \
            --cached \
            --quiet
          then

            echo \
              "No hay cambios."

          else

            git commit \
              -m "Actualizar IPTV LATAM"

            git push

          fi
